<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Post -->
  <rect x="30" y="0" width="5" height="64" rx="2.5" fill="#AAAAAA"/>
  <!-- Gold cap -->
  <rect x="27" y="0" width="11" height="6" rx="2" fill="#D4AF37"/>
  <!-- Red outer ring -->
  <circle cx="32" cy="28" r="22" fill="#C0392B"/>
  <!-- Dark inner field -->
  <circle cx="32" cy="28" r="14" fill="#111118"/>
  <!-- Hairline divider -->
  <line x1="14" y1="28" x2="50" y2="28" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <!-- S — upper, gold italic -->
  <text x="32" y="25"
        font-family="Georgia,serif"
        font-size="16" font-weight="900" font-style="italic"
        fill="#D4AF37"
        text-anchor="middle" dominant-baseline="middle">S</text>
  <!-- R — lower, grey -->
  <text x="32" y="38"
        font-family="Georgia,serif"
        font-size="12" font-weight="700"
        fill="#8A8A9A"
        text-anchor="middle" dominant-baseline="middle">R</text>
</svg>
