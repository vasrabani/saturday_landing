<button type="button" class="enc-mark"
        data-role="mark-open"
        aria-controls="enc-about-sheet"
        aria-label="About Saturday Racing">
  <span class="enc-mark__monogram" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="18" height="18" role="presentation">
      <circle cx="12" cy="12" r="11" fill="var(--enc-sage-deep)"/>
      <text x="12" y="15.7" text-anchor="middle"
            font-family="Iowan Old Style, Palatino, Georgia, serif"
            font-size="10.5" font-weight="700" letter-spacing="0.02em"
            fill="var(--enc-paper)">SR</text>
    </svg>
  </span>
  <span class="enc-mark__word">
    <span class="enc-mark__label">A</span>
    <span class="enc-mark__brand">Saturday Racing</span>
    <span class="enc-mark__label">production</span>
  </span>
  <span class="enc-mark__chevron" aria-hidden="true">
    <svg viewBox="0 0 10 10" width="10" height="10" role="presentation">
      <path d="M3.5 2.5 L6.5 5 L3.5 7.5" fill="none"
            stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>
</button>
