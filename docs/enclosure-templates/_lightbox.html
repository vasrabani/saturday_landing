<div class="enc-lightbox" id="enc-lightbox" role="dialog" aria-modal="true"
     aria-label="Photo viewer" hidden>
  <button type="button" class="enc-lightbox__close"
          data-role="lightbox-close" aria-label="Close photo">
    &times;
  </button>
  <img class="enc-lightbox__img" data-role="lightbox-img"
       alt="" src="">
  <p class="enc-lightbox__caption" data-role="lightbox-caption" hidden></p>
</div>
