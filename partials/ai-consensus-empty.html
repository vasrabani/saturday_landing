<!-- AI Chamber · consensus: empty (the {% else %} branch)
     Fewer than two models have a pick, so there is no consensus to draw.
     This is the state the captured snapshot day was actually in, and the
     most common one before a card is analysed. -->
<div class="ac-split ac-split--empty">
  <div class="ac-split__card ac-split__card--waiting">
    <p class="ac-split__lbl">CHAMBER WAITING</p>
    <p class="ac-split__note">
      At least two AI picks are needed to show a consensus snapshot. The
      engines run once the card is declared.
    </p>
  </div>
</div>
