<!-- Market intelligence · nothing has moved yet (_money_moves.html hides
     the whole section when has_data is false)
     Early on a card there are no moves to report. Production removes the
     section; the redesign gives it a headline and a steam panel that would
     render empty, so this is the third option: keep the section, say why
     it is quiet, and give the reader somewhere to go.

     If you would rather it disappear as production does, drop this and
     keep the {% if money_moves.has_data %} guard around the section. -->
<div class="mi-grid mi-grid--empty">
  <div class="mi-steam mi-steam--empty">
    <p class="mi-steam__kicker">MARKET QUIET</p>
    <p class="mi-steam__horse mi-steam__horse--empty">No moves yet</p>
    <p class="mi-steam__meta">
      Prices firm up through the morning. The board fills as the market
      takes a view.
    </p>
    <a class="mi-steam__cta" href="https://www.saturday-racing.com/races/">
      Browse today&rsquo;s card
      <span class="cta-dash-tail"> &mdash; all meetings</span>
    </a>
  </div>
</div>
