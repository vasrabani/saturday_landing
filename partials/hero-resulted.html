<!-- Hero · the race has been run (hero_fold.html: {% if hero.result %})
     Every Saturday evening the hero is in this state, and the redesign had
     no markup for it. The styles were still in hero-fold.css, and
     landing.js still wires the spoiler, so this is the structure they
     expect: tone class on the column (hf-tone-hit / -miss / -void),
     [data-hero-result] for the script, and the winner behind a reveal so
     the page does not spoil the result for someone who has not watched.

     Placement: this replaces the hero's title column content when
     hero.result is set; the countdown column becomes the result panel. -->
<div class="hero-fold__col hero-fold__col--title hero-fold__col--resulted hf-tone-hit">
  <div class="hf-race-reveal">
    <span class="hf-race-reveal__eyebrow hf-race-reveal__eyebrow--resulted">
      <span class="hf-race-reveal__dot hf-race-reveal__dot--resulted" aria-hidden="true"></span>
      <span>RESULT &middot; 15:45 MUSSELBURGH</span>
    </span>
  </div>

  <h1 class="hf-title hf-title--oneline">
    <span class="hf-title__lead">The Fox</span>
    <span class="hf-title__fox">called it.</span>
  </h1>

  <div class="hf-result" data-hero-result>
    <div class="hf-result__headline">
      Portobello Cup Handicap Stakes (GBBPlus Race)
    </div>

    <div class="hf-result__panel">
      <div class="hf-result__row hf-result__row--winner">
        <div class="hf-result__label">Winner</div>
        <div class="hf-result__winner">
          <button
            type="button"
            class="hf-result__spoiler"
            data-spoiler
            data-action="reveal-result"
            data-race-id="4434"
            aria-pressed="false"
            aria-label="Tap to reveal the winner"
          >
            <span class="hf-result__spoiler-cover">Tap to reveal winner</span>
            <span class="hf-result__spoiler-payload">
              <span class="hf-result__horse">Dark Cloud Rising</span>
              <span class="hf-result__sp">SP 7/2</span>
            </span>
          </button>
          <div class="hf-result__connections">P J McDonald &middot; K Dalgleish</div>
        </div>
      </div>

      <div class="hf-result__verdict">
        <div class="hf-result__verdict-item hf-result__verdict-item--fox is-correct">
          <span class="hf-result__verdict-tag">Fox</span>
          <span class="hf-result__verdict-pick">Dark Cloud Rising</span>
          <span class="hf-result__verdict-icon" aria-hidden="true">&check;</span>
        </div>
        <div class="hf-result__verdict-item hf-result__verdict-item--cubs is-wrong">
          <span class="hf-result__verdict-tag">Cubs</span>
          <span class="hf-result__verdict-pick">Vegasmile</span>
          <span class="hf-result__verdict-icon" aria-hidden="true">&times;</span>
        </div>
      </div>
    </div>
  </div>
</div>
