<!-- Nav and footer · signed in (base.html and partials/footer.html:
     {% if user.is_authenticated %})
     The redesign drew the signed-out chrome only, so a Cub who is logged
     in still sees "Join Free" and "Login". Three places change.

     1. The nav actions, as production's base.html renders them: the
        picks pill, the Cub's name (truncated past 150px, full name in the
        title) and Sign out. Sign out hides at 1280px and wider, where the
        link row needs the room; it stays in the footer and the menu. -->
<div class="site-nav__actions">
  <a href="https://www.saturday-racing.com/races/big-race/" class="site-nav__badge" title="Portobello Cup Handicap Stakes (GBBPlus Race)">
    🏆 <span class="site-nav__badge-name">Portobello Cup Handicap Stakes (GBBPlus Race)</span>
  </a>
  <span class="site-nav__sep" aria-hidden="true"></span>
  <a href="https://www.saturday-racing.com/my-picks/?period=today" class="picks-pill picks-pill--fresh picks-pill--has-nudge" data-picks-pill title="2 of 6 picks used today — view your scoreboard · 2× points still available on Portobello Cup Handicap Stakes (GBBPlus Race)" aria-label="My picks">
    <span class="picks-pill__icon" aria-hidden="true">🐾</span>
    <span class="picks-pill__count" data-picks-count><span data-picks-used>2</span><span class="picks-pill__sep">/</span><span data-picks-max>6</span></span>
    <span class="picks-pill__nudge" aria-hidden="true">✨</span>
  </a>
  <a href="https://www.saturday-racing.com/members/profile/" class="site-nav__pill site-nav__pill--cub" title="Rosie M">
    🐾 <span class="site-nav__pill-name">Rosie M</span>
  </a>
  <a href="https://www.saturday-racing.com/members/logout/" class="site-nav__auth-link">
    <span class="site-nav__auth-icon">↩</span> Sign out
  </a>
</div>

<!-- 2. The footer's account links, in the Community column, in place of
     Sign in and Join free. -->
<ul class="sf__nav-list">
  <li><a href="https://www.saturday-racing.com/members/profile/">My profile</a></li>
  <li><a href="https://www.saturday-racing.com/members/logout/">Sign out</a></li>
</ul>

<!-- 3. The hero's Fox card points at the pick itself rather than at the
     join page. In Django that is the data-picks-half-href value:

       data-picks-half-href="{% if user.is_authenticated %}{% url 'pick' %}{% else %}{% url 'cub_register' %}{% endif %}"
-->
